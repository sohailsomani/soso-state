[tox]
envlist = test, lint, type, pypy38

[testenv:test]
basepython = python3.13
install_command = pip install -U --verbose --pre {opts} {packages}
deps =
  -rrequirements.txt
  -rrequirements-dev.txt
setenv = PYTHONOPTIMIZE={env:PYTHONOPTIMIZE:""}
commands = pytest --cov-report term-missing --cov=soso --profile-svg

[testenv:lint]
basepython = python3.13
commands = flake8 soso
deps = flake8
  pep8-naming

[testenv:type]
basepython = python3.13
commands =
  mypy --version
  mypy --strict -p soso -p tests -p examples
deps =
  -rrequirements.txt
  -rrequirements-dev.txt
  -rexamples/requirements-examples.txt

[testenv:pypy38]
basepython = pypy3.13
install_command = pip install -U --verbose --pre {opts} {packages}
setenv = PYTHONOPTIMIZE={env:PYTHONOPTIMIZE:""}
deps =
  -rrequirements.txt
  -rrequirements-dev-pypy.txt
commands = pytest
